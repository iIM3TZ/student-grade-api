name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      # 1) Get the source code from the repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history

      # 2) Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3) Compile + run all JUnit tests
      - name: Build and test with Maven
        run: mvn --batch-mode clean verify

      # 4) Run SonarQube Cloud analysis
      - name: SonarQube Cloud scan
        env:
          SONAR_TOKEN_RAW: ${{ secrets.SONAR_TOKEN }}
        run: |
          export SONAR_TOKEN="$(printf '%s' "$SONAR_TOKEN_RAW" | tr -d '[:space:]')"
          mvn --batch-mode sonar:sonar

      # 5) Log in to Docker Hub (only on push to main)
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # keep only visible ASCII characters (drops newlines, spaces, hidden unicode)
          U="$(printf '%s' "$DH_USER" | LC_ALL=C tr -cd '[:graph:]')"
          T="$(printf '%s' "$DH_TOKEN" | LC_ALL=C tr -cd '[:graph:]')"
          # lengths only - the values are never printed
          echo "username length: ${#U} (raw: ${#DH_USER})"
          echo "token length: ${#T} (raw: ${#DH_TOKEN})"
          if [ -z "$U" ] || [ -z "$T" ]; then
            echo "::error::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret is empty"
            exit 1
          fi
          printf '%s' "$T" | docker login -u "$U" --password-stdin

      # 6) Build the Docker image and push it to Docker Hub
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/student-grade-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/student-grade-api:${{ github.sha }}
